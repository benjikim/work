<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://use.typekit.net/bbw6nis.css" />
    <title>Annual Quote Results Copy</title>
    <link
      rel="stylesheet"
      crossorigin
      href="../assets/quote-results-app.css?v=20260819-annual-3"
    />
  </head>
  <body>
    <div id="quote-results-app"></div>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        let shouldReplace = false;

        if (!params.get('_qid')) {
          params.set('_qid', '1f1977e7-3bb4-6d20-82e4-7912336f76ec');
          shouldReplace = true;
        }

        if (!params.get('mode')) {
          params.set('mode', 'annual');
          shouldReplace = true;
        }

        if (shouldReplace) {
          const nextUrl =
            window.location.pathname + '?' + params.toString() + window.location.hash;
          window.history.replaceState({}, '', nextUrl);
        }
      })();
    </script>
    <script
      type="module"
      crossorigin
      src="../assets/quote-results-app.js?v=20260819-annual-3"
    ></script>
  </body>
</html>
